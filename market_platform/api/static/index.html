<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order-Block Platform</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#f7f7f5;--fg:#1c1c1c;--muted:#6b6b6b;--card:#fff;--line:#e2e2de;--bull:#0f7b4f;--bear:#b3261e;--warn:#9a6700;--accent:#2457c5}
@media (prefers-color-scheme: dark){:root{--bg:#141414;--fg:#e8e8e6;--muted:#9a9a96;--card:#1d1d1d;--line:#2e2e2c;--bull:#3ecf8e;--bear:#ff6b61;--warn:#e3b341;--accent:#7aa2ff}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0}.pill{padding:2px 8px;border-radius:10px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
nav{display:flex;gap:2px;overflow-x:auto;padding:0 16px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;padding:9px 10px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
nav button.on{color:var(--fg);border-bottom-color:var(--accent)}
main{padding:14px 16px;max-width:1400px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card h3{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.big{font-size:20px;font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
input,select,textarea{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font:inherit}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{cursor:pointer;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card)}tr:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.bull{color:var(--bull)}.bear{color:var(--bear)}.warn{color:var(--warn)}.muted{color:var(--muted)}
.pager{display:flex;gap:8px;align-items:center;margin:8px 0}button.btn{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 10px;color:var(--fg);cursor:pointer}
#detail{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
#detail .panel{background:var(--bg);border-radius:10px;max-width:1100px;width:100%;padding:14px;border:1px solid var(--line)}
#chart{height:380px;margin:8px 0}pre{white-space:pre-wrap;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;max-height:320px;overflow:auto}
.reason{display:block;margin:2px 0}.code{font-family:ui-monospace,monospace;font-size:12px}
</style>
</head>
<body>
<header><h1>Order-Block Platform</h1><span class="pill" id="mode">paper</span><span class="pill" id="run">run —</span><span class="pill" id="hash"></span><span class="pill" id="healthpill">health —</span></header>
<nav id="tabs"></nav>
<main id="main"></main>
<div id="detail"><div class="panel" id="dpanel"></div></div>
<script>
const TABS=[["overview","Market Overview"],["bullish","Bullish"],["bearish","Bearish"],["indices","Indices"],["sectors","Sectors"],["stocks","Stocks"],["options","Options"],["portfolio","Paper Portfolio"],["journal","Trade Journal"],["backtests","Backtesting"],["health","System Health"],["config","Configuration"]];
const $=s=>document.querySelector(s);const esc=v=>v==null?"":String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=v=>v==null?"—":(typeof v==="number"?(Math.abs(v)>=1000?v.toLocaleString(undefined,{maximumFractionDigits:0}):+v.toFixed(3)):v);
async function J(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error(await r.text());return r.json()}
let state={tab:"overview",run:null};
function nav(){$("#tabs").innerHTML=TABS.map(([k,l])=>`<button data-k="${k}" class="${k===state.tab?"on":""}">${l}</button>`).join("");document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.k;nav();render()})}
function kv(v){return v&&typeof v==="object"?`<div style="font-size:13px;font-weight:400">${Object.entries(v).map(([a,b])=>`<div><span class="muted">${esc(a)}</span> ${esc(typeof b==="object"?JSON.stringify(b):fmt(b))}</div>`).join("")||"—"}</div>`:esc(fmt(v))}
function cards(obj){return `<div class="grid">${Object.entries(obj).map(([k,v])=>`<div class="card"><h3>${esc(k)}</h3><div class="big">${kv(v)}</div></div>`).join("")}</div>`}
function table(cols,rows,{onRow,sort,order,onSort}={}){return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th data-s="${c[0]}">${esc(c[1])}${sort===c[0]?(order==="asc"?" ▲":" ▼"):""}</th>`).join("")}</tr></thead><tbody>${rows.map((r,i)=>`<tr data-i="${i}" style="${onRow?"cursor:pointer":""}">${cols.map(c=>`<td>${c[2]?c[2](r):esc(fmt(r[c[0]]))}</td>`).join("")}</tr>`).join("")||`<tr><td class="muted" colspan="${cols.length}">nothing yet</td></tr>`}</tbody></table></div>`}
function bindTable(rows,onRow,onSort){document.querySelectorAll("tbody tr[data-i]").forEach(tr=>{if(onRow)tr.onclick=()=>onRow(rows[+tr.dataset.i])});if(onSort)document.querySelectorAll("th[data-s]").forEach(th=>th.onclick=()=>onSort(th.dataset.s))}
const dirCls=d=>d==="bullish"?"bull":d==="bearish"?"bear":"";
async function header(){try{const o=await J("/api/overview");state.run=o.run_id;$("#run").textContent="run "+(o.run_id||"—");$("#hash").textContent="config "+o.config_hash;$("#mode").textContent=o.execution_mode;$("#healthpill").textContent="health "+o.health;$("#healthpill").className="pill "+(o.health==="OK"?"bull":o.health==="DOWN"?"bear":"warn")}catch(e){}}
// ---------------------------------------------------------------- sections
const R={};
R.overview=async()=>{const o=await J("/api/overview");const c=o.context||{};let h=cards({"regime":c.regime||"—","confidence":c.regime_conf,"volatility":c.vol_regime,"data quality":c.quality,"bullish board":o.board.bullish||{},"bearish board":o.board.bearish||{},"portfolio":o.portfolio,"health":o.health});
h+=`<h3>Breadth</h3>${cards(c.breadth||{})}<h3>Benchmark</h3>${cards(c.benchmark||{})}`;if((c.events||[]).length)h+=`<h3>Events today</h3><pre>${esc(JSON.stringify(c.events,null,1))}</pre>`;return h};
function board(pipeline){return async()=>{const st=state[pipeline]||(state[pipeline]={page:1,sort:"detected_at",order:"desc",status:"",horizon:"",q:"",sector:"",index:""});
const p=new URLSearchParams({pipeline,page:st.page,size:50,sort:st.sort,order:st.order});["status","horizon","q","sector","index"].forEach(k=>st[k]&&p.set(k,st[k]));const d=await J("/api/signals?"+p);
const f=`<div class="filters"><select id="f_status"><option value="">any status</option>${["QUALIFIED","WATCH","REJECTED","SUPPRESSED","APPROVED","EXECUTED","NOT_EXECUTABLE"].map(s=>`<option ${st.status===s?"selected":""}>${s}</option>`).join("")}</select><select id="f_h"><option value="">any horizon</option><option ${st.horizon==="intraday"?"selected":""}>intraday</option><option ${st.horizon==="overnight"?"selected":""}>overnight</option></select><input id="f_q" placeholder="instrument" value="${esc(st.q)}"><input id="f_sec" placeholder="sector" value="${esc(st.sector)}"><input id="f_idx" placeholder="index e.g. NSE:NIFTY BANK" value="${esc(st.index)}"><button class="btn" id="f_go">apply</button></div>`;
const cols=[["detected_at","Detected"],["instrument_key","Instrument"],["horizon","Horizon"],["setup_type","Setup"],["timeframe","TF"],["entry","Entry"],["stop","Stop"],["targets","Target",r=>fmt(r.targets[0])],["rr","R:R"],["score","Score"],["status","Status",r=>`<span class="${r.status==="QUALIFIED"||r.status==="EXECUTED"||r.status==="APPROVED"?dirCls(pipeline):r.status==="REJECTED"?"muted":"warn"}">${r.status}</span>`],["reasons","Why",r=>esc((r.reject_reasons[0]||r.qualify_reasons[0]||"").slice(0,60))]];
setTimeout(()=>{$("#f_go").onclick=()=>{st.status=$("#f_status").value;st.horizon=$("#f_h").value;st.q=$("#f_q").value;st.sector=$("#f_sec").value;st.index=$("#f_idx").value;st.page=1;render()};bindTable(d.items,r=>openSignal(r.run_id,r.signal_id),s=>{if(s==="targets"||s==="reasons")return;st.order=st.sort===s&&st.order==="desc"?"asc":"desc";st.sort=s;render()});pager(d,st)},0);
return `<h2 class="${dirCls(pipeline)}">${pipeline[0].toUpperCase()+pipeline.slice(1)} opportunities <span class="muted">(${d.total})</span></h2>${f}${table(cols,d.items,{sort:st.sort,order:st.order})}<div class="pager" id="pager"></div>`}}
function pager(d,st){const pages=Math.max(1,Math.ceil(d.total/d.size));$("#pager").innerHTML=`<button class="btn" id="pv">‹</button><span>page ${d.page} / ${pages}</span><button class="btn" id="nx">›</button>`;$("#pv").onclick=()=>{if(st.page>1){st.page--;render()}};$("#nx").onclick=()=>{if(st.page<pages){st.page++;render()}}}
R.bullish=board("bullish");R.bearish=board("bearish");
R.indices=async()=>{const d=await J("/api/indices");setTimeout(()=>bindTable(d.items,r=>openInstrument(r.instrument_key)),0);return `<h2>Indices <span class="muted">snapshot ${esc(d.snapshot||"—")}</span></h2>`+table([["instrument_key","Index"],["sector","Sector"],["deriv_underlying","F&O"],["lot_size","Lot"],["weekly_options","Weekly"],["price","Last",r=>fmt(r.price&&r.price.last)],["chg","Chg %",r=>{const v=r.price&&r.price.change_pct;return v==null?"—":`<span class="${v>=0?"bull":"bear"}">${fmt(v)}</span>`}],["trend","15m trend",r=>esc(r.context&&r.context.trend)],["data_status","Data"]],d.items)};
R.sectors=async()=>{const d=await J("/api/sectors");const a=d.filter(x=>x.sector),b=d.filter(x=>x.sector_index);return "<h2>Sectors</h2>"+table([["sector","Sector"],["instruments","Instruments"],["fno","F&O"],["signals","Signals",r=>esc(JSON.stringify(r.signals))]],a)+"<h3>Sector indices (context)</h3>"+table([["sector_index","Index"],["trend","Trend",r=>esc(r.context.trend)],["rs20","RS 20d",r=>fmt(r.context.rs20)],["adv","Adv/Dec",r=>`${r.context.advancing}/${r.context.declining}`],["chg","Day %",r=>fmt(r.context.day_change_pct)]],b)};
R.stocks=async()=>{const st=state.stocks||(state.stocks={page:1,sort:"symbol",order:"asc",q:"",sector:"",fno:""});const p=new URLSearchParams({page:st.page,size:100,sort:st.sort,order:st.order});["q","sector","fno"].forEach(k=>st[k]&&p.set(k,st[k]));const d=await J("/api/stocks?"+p);
setTimeout(()=>{$("#s_go").onclick=()=>{st.q=$("#s_q").value;st.sector=$("#s_sec").value;st.fno=$("#s_fno").value;st.page=1;render()};bindTable(d.items,r=>openInstrument(r.instrument_key),s=>{st.order=st.sort===s&&st.order==="asc"?"desc":"asc";st.sort=s;render()});pager(d,st)},0);
return `<h2>Stocks <span class="muted">(${d.total})</span></h2><div class="filters"><input id="s_q" placeholder="symbol" value="${esc(st.q)}"><input id="s_sec" placeholder="sector" value="${esc(st.sector)}"><select id="s_fno"><option value="">F&O any</option><option value="true" ${st.fno==="true"?"selected":""}>F&O only</option><option value="false" ${st.fno==="false"?"selected":""}>no F&O</option></select><button class="btn" id="s_go">apply</button></div>`+table([["symbol","Symbol"],["sector","Sector"],["lot_size","Lot"],["weekly_options","Weekly"],["adv_value_cr","ADV ₹cr"],["liquidity_tier","Tier"],["price","Last",r=>fmt(r.price&&r.price.last)],["data_status","Data"],["indices","Indices",r=>r.indices.length]],d.items,{sort:st.sort,order:st.order})+`<div class="pager" id="pager"></div>`};
R.options=async()=>{const d=await J("/api/options");return "<h2>Options decisions</h2>"+table([["ts","Time"],["instrument_key","Underlying"],["pipeline","Pipeline"],["route","Route"],["approved","Approved"],["structure","Structure",r=>esc(r.pricing&&r.pricing.structure)],["ev","EV/lot",r=>fmt(r.pricing&&r.pricing.ev_per_lot)],["why","Reason",r=>esc((r.reason_codes||[])[0]||"")]],d.decisions)+"<h3>Archived quote coverage</h3>"+table([["underlying","Underlying"],["contracts","Contracts"],["last","Last captured"]],d.archive_coverage)};
R.portfolio=async()=>{const d=await J("/api/portfolio");setTimeout(()=>bindTable(d.open_positions,r=>openSignal(d.run_id,r.signal_id)),0);return "<h2>Paper portfolio</h2>"+cards({...d.counts,"closed trades":d.closed.n,"net P&L ₹":d.closed.net_pnl,"charges ₹":d.closed.charges})+(d.snapshot?cards({"unrealised ₹":d.snapshot.unrealised,"realised today ₹":d.snapshot.realised_today,"open risk ₹":d.snapshot.exposure.total_risk}):"")+table([["opened_at","Opened"],["instrument_key","Instrument"],["direction","Dir",r=>`<span class="${dirCls(r.direction)}">${r.direction}</span>`],["horizon","Horizon"],["segment","Segment"],["structure","Structure"],["quantity","Qty"],["entry_net","Entry"],["u_stop","Stop"],["u_target","Target"],["risk_rupees","Risk ₹"]],d.open_positions)};
R.journal=async()=>{const st=state.journal||(state.journal={page:1});const d=await J("/api/journal?page="+st.page);setTimeout(()=>{bindTable(d.items,r=>openSignal(r.run_id,r.signal_id));pager(d,st)},0);return `<h2>Trade journal <span class="muted">(${d.total})</span></h2>`+table([["closed_at","Closed"],["instrument_key","Instrument"],["direction","Dir",r=>`<span class="${dirCls(r.direction)}">${r.direction}</span>`],["horizon","Horizon"],["structure","Structure"],["exit_reason","Exit"],["net_pnl","Net ₹",r=>`<span class="${r.net_pnl>=0?"bull":"bear"}">${fmt(r.net_pnl)}</span>`],["r_multiple","R"],["charges","Costs ₹"],["gap_pnl","Gap ₹"]],d.items)+`<div class="pager" id="pager"></div>`};
R.backtests=async()=>{const d=await J("/api/backtests");return "<h2>Backtests</h2>"+table([["started_at","Started"],["run_id","Run"],["notes","Notes",r=>esc((r.notes||"").slice(0,70))],["n","Trades",r=>fmt(r.development&&r.development.n)],["er","E[R]",r=>fmt(r.development&&r.development.expectancy_r)],["ci","CI",r=>esc(r.development&&JSON.stringify(r.development.expectancy_ci))],["net","Net ₹",r=>fmt(r.development&&r.development.net_pnl)],["gates","Gates",r=>esc((r.gates||[]).map(g=>`${g.pipeline[0]}${g.horizon[0]}:${g.gate_a?"A":"-"}${g.gate_b?"B":"-"}`).join(" "))],["universe_snapshot","Universe"],["config_hash","Config"]],d)};
R.health=async()=>{const d=await J("/api/health");const comps=Object.entries(d.components).map(([k,v])=>({component:k,...v}));return `<h2>System health: <span class="${d.overall==="OK"?"bull":d.overall==="DOWN"?"bear":"warn"}">${d.overall}</span></h2>`+table([["component","Component"],["state","State",r=>{const s=(r.state||"").toUpperCase();return `<span class="${s==="OK"?"bull":s==="DOWN"?"bear":"warn"}">${esc(r.state)}</span>`}],["metric","Metric"],["value","Value"],["age_sec","Age s"],["last_bar","Last bar"],["ts","At"],["detail","Detail",r=>esc((r.detail||"").slice(0,90))]],comps)+"<h3>Quality events (24h)</h3>"+cards(d.quality_24h)};
R.config=async()=>{const d=await J("/api/config");setTimeout(()=>{$("#v_go").onclick=async()=>{const r=await J("/api/config/validate",{method:"POST",body:$("#v_body").value});$("#v_out").textContent=JSON.stringify(r,null,2)}},0);return `<h2>Configuration <span class="muted">hash ${d.hash} · read-only</span></h2><pre>${esc(JSON.stringify(d.config,null,2))}</pre><h3>Validate a change (nothing is saved)</h3><textarea id="v_body" rows="6" style="width:100%" placeholder='[risk]\nrisk_per_trade_pct = 0.4'></textarea><div><button class="btn" id="v_go">validate</button></div><pre id="v_out"></pre><h3>All keys</h3>`+table([["key","Key"],["type","Type"],["default","Default",r=>esc(JSON.stringify(r.default))],["range","Range",r=>r.range?`[${r.range.lo}, ${r.range.hi}] ${esc(r.range.unit)}`:""]],d.keys)};
// ---------------------------------------------------------------- detail views
function closeDetail(){$("#detail").style.display="none"}$("#detail").onclick=e=>{if(e.target.id==="detail")closeDetail()};
async function openSignal(run,id){const s=await J(`/api/signal/${encodeURIComponent(run)}/${encodeURIComponent(id)}`);$("#detail").style.display="flex";
const ex=(s.explanation.qualify.concat(s.explanation.reject)).map(r=>`<span class="reason"><span class="code">${esc(r.code)}</span> ${esc(r.text)}</span>`).join("");
const rd=s.risk_decision?`<h3>Risk decision: ${s.risk_decision.approved?'<span class="bull">approved</span>':'<span class="bear">rejected</span>'} · ${esc(s.risk_decision.route||"")} · lots ${s.risk_decision.lots} × ${s.risk_decision.lot_size} · risk ₹${fmt(s.risk_decision.risk_rupees)}</h3>${s.risk_decision.explanation.map(r=>`<span class="reason"><span class="code">${esc(r.code)}</span> ${esc(r.text)}</span>`).join("")}`:"<p class='muted'>Not sent to the governor (not QUALIFIED).</p>";
$("#dpanel").innerHTML=`<button class="btn" onclick="closeDetail()">close</button> <button class="btn" onclick="openInstrument('${esc(s.instrument_key)}')">chart</button><h2 class="${dirCls(s.pipeline)}">${esc(s.instrument_key)} · ${s.pipeline} ${s.horizon} · ${s.status}</h2>${cards({entry:s.entry,stop:s.stop,target:s.targets[0],"R:R":s.rr,score:s.score,cluster:s.cluster_id,"zone":`${s.zone_low}–${s.zone_high}`,"detected":s.detected_at,"available":s.available_at})}<h3>Why</h3>${ex||"<span class='muted'>—</span>"}<h3>Score breakdown</h3>${cards(s.score_detail.parts||{})}<p class="muted">routes: ${esc((s.score_detail.routes||[]).join(", "))} · HTF trend ${esc(s.score_detail.htf_trend)}</p><h3>Confirmations</h3>${table([["code","Code"],["value","Value"],["threshold","Threshold"],["passed","Pass",r=>r.passed==null?"n/a":r.passed?'<span class="bull">yes</span>':'<span class="bear">no</span>']],s.confirmations)}<h3>Context</h3><pre>${esc(JSON.stringify(s.context,null,1))}</pre>${rd}<h3>Orders & fills</h3>${table([["purpose","Purpose"],["instrument_key","Instrument"],["transaction_type","Side"],["quantity","Qty"],["fill_price","Fill"],["fill_model","Model"],["charges","Costs"],["status","Status"]],s.orders)}<h3>Audit trail</h3>${table([["ts","Time"],["status","Status"],["reason","Reason"]],s.history)}`}
async function openInstrument(key,tf){tf=tf||"15m";const d=await J(`/api/instrument/${encodeURIComponent(key)}?tf=${tf}`);$("#detail").style.display="flex";
$("#dpanel").innerHTML=`<button class="btn" onclick="closeDetail()">close</button> ${["5m","15m","60m"].map(t=>`<button class="btn" onclick="openInstrument('${esc(key)}','${t}')">${t}</button>`).join(" ")}<h2>${esc(key)} <span class="muted">${tf}</span></h2><div id="chart"></div>${d.meta?cards({sector:d.meta.sector,lot:d.meta.lot_size,"F&O":!!d.meta.fno_eligible,weekly:!!d.meta.weekly_options,tier:d.meta.liquidity_tier,data:d.meta.data_status}):""}<h3>Zones</h3>${table([["bos_bar_ts","BOS"],["timeframe","TF"],["direction","Dir",r=>`<span class="${dirCls(r.direction)}">${r.direction}</span>`],["kind","Kind"],["zone_low","Low"],["zone_high","High"],["status","Status"],["close_reason","Closed because"]],d.zones)}<h3>Signals</h3>${table([["detected_at","Detected"],["pipeline","Pipeline"],["horizon","Horizon"],["score","Score"],["status","Status"]],d.signals)}<h3>Similar setups (closed, all instruments)</h3>${cards(d.similar_setups)}`;
setTimeout(()=>bindTable(d.signals,r=>openSignal(r.run_id,r.signal_id)),0);
if(!window.LightweightCharts||!d.bars.length)return;const el=$("#chart");const dark=matchMedia("(prefers-color-scheme: dark)").matches;
const ch=LightweightCharts.createChart(el,{height:380,layout:{background:{color:"transparent"},textColor:dark?"#ccc":"#333"},grid:{vertLines:{visible:false},horzLines:{color:dark?"#2a2a2a":"#eee"}},timeScale:{timeVisible:true}});
const cs=ch.addCandlestickSeries();cs.setData(d.bars.map(b=>({time:b.time,open:b.open,high:b.high,low:b.low,close:b.close})));
d.zones.filter(z=>z.status==="ACTIVE"||z.status==="TOUCHED").forEach(z=>{const c=z.direction==="bullish"?"#0f7b4f":"#b3261e";cs.createPriceLine({price:z.zone_high,color:c,lineWidth:1,lineStyle:2,title:`${z.timeframe} ${z.direction} OB`});cs.createPriceLine({price:z.zone_low,color:c,lineWidth:1,lineStyle:2,title:""})});
const marks=d.signals.map(s=>({time:s.marker_time,position:s.pipeline==="bullish"?"belowBar":"aboveBar",color:s.pipeline==="bullish"?"#0f7b4f":"#b3261e",shape:s.pipeline==="bullish"?"arrowUp":"arrowDown",text:s.status})).sort((a,b)=>a.time-b.time);
try{cs.setMarkers(marks)}catch(e){}ch.timeScale().fitContent()}
async function render(){const m=$("#main");m.innerHTML="<p class='muted'>loading…</p>";try{m.innerHTML=await R[state.tab]()}catch(e){m.innerHTML=`<p class="bear">${esc(e.message)}</p>`}}
nav();header();render();setInterval(()=>{header();if(["overview","health","portfolio"].includes(state.tab))render()},30000);
</script>
</body>
</html>
